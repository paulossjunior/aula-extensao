site_name: Curso de Extensão — Desenvolvimento de Projetos Suportado por IA
site_description: Documentação oficial do curso de extensão em desenvolvimento de projetos suportado por Inteligência Artificial.
site_author: Paulo Junior
site_url: https://paulossjunior.github.io/aula-extensao/
repo_url: https://github.com/paulossjunior/aula-extensao
repo_name: paulossjunior/aula-extensao
edit_uri: edit/main/docs/
docs_dir: docs
theme:
  name: material
  language: pt
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.integrate
    - content.action.edit
plugins:
  - search:
      lang: pt
  - mermaid2
nav:
  - Início: index.md
  - Plano de Aula:
    - Visão Geral: plano-de-aula/index.md
    - Aulas Práticas:
      - Aula 01 — 03/08/2026: plano-de-aula/aulas/aula-01-2026-08-03.md
      - Aula 02 — 10/08/2026: plano-de-aula/aulas/aula-02-2026-08-10.md
      - Aula 03 — 17/08/2026: plano-de-aula/aulas/aula-03-2026-08-17.md
      - Aula 04 — 24/08/2026: plano-de-aula/aulas/aula-04-2026-08-24.md
      - Aula 06 — 14/09/2026: plano-de-aula/aulas/aula-06-2026-09-14.md
      - Aula 07 — 21/09/2026: plano-de-aula/aulas/aula-07-2026-09-21.md
      - Aula 09 — 05/10/2026: plano-de-aula/aulas/aula-09-2026-10-05.md
      - Aula 10 — 19/10/2026: plano-de-aula/aulas/aula-10-2026-10-19.md
      - Aula 12 — 09/11/2026: plano-de-aula/aulas/aula-12-2026-11-09.md
      - Aula 13 — 16/11/2026: plano-de-aula/aulas/aula-13-2026-11-16.md
      - Aula 14 — 23/11/2026: plano-de-aula/aulas/aula-14-2026-11-23.md
      - Aula 16 — 07/12/2026: plano-de-aula/aulas/aula-16-2026-12-07.md
  - Avaliação: avaliacao/avaliacao.md
  - Cronograma: cronograma/cronograma.md
  - Materiais de Apoio: materiais/index.md
  - Modelos:
      - Template PRD: modelos/prd-template.md
      - Template Geral de Aula: modelos/template.md
      - Template de Planejamento Scrum: modelos/scrum-planejamento-template.md
      - Exemplo de Planejamento Scrum: modelos/scrum-planejamento-exemplo.md
      - Template de DSM: modelos/dsm-template.md
      - Exemplo de DSM: modelos/dsm-exemplo.md
      - Exemplo de DSM com Loop: modelos/dsm-exemplo-loop-erro.md
      - Exemplo de SDD (TODO List React + C#): modelos/sdd-exemplo-todo-react-csharp.md
      - Exemplo TODO List usando Caveman: modelos/caveman-exemplo-todo-list.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
